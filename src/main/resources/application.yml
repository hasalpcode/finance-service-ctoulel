
server:
  port: 8083

security:
  jwt:
    secret-key: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
    expiration-time: ${JWT_EXPIRATION:3600000} # 1h

spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  application:
    name: finance-service
  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:8889/ong_finance_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true