
server:
  port: 8083

security:
  jwt:
    secret-key: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
    expiration-time: ${JWT_EXPIRATION:3600000} # 1h

spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8886}
  application:
    name: finance-service
  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:8889/ong_finance_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

paydunya:
  base-url: ${PAYDUNYA_BASE_URL:https://app.paydunya.com/sandbox-api/v1}
  disburse-base-url: ${PAYDUNYA_DISBURSE_BASE_URL:https://app.paydunya.com/api/v2/disburse}
  master-key: ${PAYDUNYA_MASTER_KEY:}
  private-key: ${PAYDUNYA_PRIVATE_KEY:}
  public-key: ${PAYDUNYA_PUBLIC_KEY:}
  token: ${PAYDUNYA_TOKEN:}
  store-name: ${PAYDUNYA_STORE_NAME:Dental}
  callback-url: ${PAYDUNYA_CALLBACK_URL:http://localhost:8080/finance-service/api/payments/webhook/paydunya}
  disburse-callback-url: ${PAYDUNYA_DISBURSE_CALLBACK_URL:http://localhost:8080/finance-service/api/payments/webhook/paydunya-disburse}
  return-url: ${PAYDUNYA_RETURN_URL:http://localhost:8080/payment/success}
  cancel-url: ${PAYDUNYA_CANCEL_URL:http://localhost:8080/payment/cancel}
  sandbox: ${PAYDUNYA_SANDBOX:true}
  sandbox-test-phone: ${PAYDUNYA_SANDBOX_PHONE:}
  sandbox-test-email: ${PAYDUNYA_SANDBOX_EMAIL:}
  sandbox-test-password: ${PAYDUNYA_SANDBOX_PASSWORD:}